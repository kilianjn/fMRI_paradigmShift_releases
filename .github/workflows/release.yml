name: Build & release

# Builds ParadigmShift for Windows, macOS and Linux from its source repository (private) and publishes the
# downloads here as a GitHub Release "v<version>"; also refreshes this repository's README, the screenshots and
# the website in docs/ (GitHub Pages: branch main, folder /docs – from the source's site/ folder).
#
#  * repository_dispatch "release" – sent by the source repository on every push to its main branch
#  * workflow_dispatch             – by hand (Actions → Build & release → Run workflow), any commit or branch
#
# Needs the secret SOURCE_DEPLOY_KEY: the private half of a read-only deploy key of the source repository.
# The source is never stored here: no caches, compiler warnings are switched off, artifacts are kept one day.
on:
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or branch of the source to build"
        default: main

permissions:
  contents: write

# one release at a time – a second push waits for the first build
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Awarnings"
  SOURCE_REPO: kilianjn/fMRI_paradigmShift
  SOURCE_REF: ${{ github.event.client_payload.ref || inputs.ref || 'main' }}

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Sound library (ALSA) for building
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Unit tests
        run: cargo test --locked --quiet

  build:
    name: build (${{ matrix.name }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
          - name: linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Build (Windows)
        if: matrix.name == 'windows'
        shell: bash
        run: |
          cargo build --release --locked
          mkdir -p dist
          cp target/release/paradigmshift.exe dist/ParadigmShift-windows-x64.exe

      - name: Build (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libasound2-dev
          cargo build --release --locked
          mkdir -p dist/ParadigmShift-linux-x86_64
          cp target/release/paradigmshift dist/ParadigmShift-linux-x86_64/paradigmshift
          cp assets/icon/icon_256.png dist/ParadigmShift-linux-x86_64/paradigmshift.png
          cat > dist/ParadigmShift-linux-x86_64/paradigmshift.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=ParadigmShift
          Comment=Timeline editor and presenter for fMRI paradigms
          Exec=paradigmshift %f
          Icon=paradigmshift
          Categories=Science;Education;
          DESKTOP
          tar -C dist -czf dist/ParadigmShift-linux-x86_64.tar.gz ParadigmShift-linux-x86_64
          rm -rf dist/ParadigmShift-linux-x86_64

      - name: Build (macOS universal .app)
        if: matrix.name == 'macos'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          APP=dist/ParadigmShift.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/ParadigmShift" \
            target/aarch64-apple-darwin/release/paradigmshift target/x86_64-apple-darwin/release/paradigmshift
          ICONSET=dist/AppIcon.iconset
          mkdir -p $ICONSET
          for s in 16 32 128 256 512; do
            cp assets/icon/icon_$s.png $ICONSET/icon_${s}x${s}.png
            cp assets/icon/icon_$((s*2)).png $ICONSET/icon_${s}x${s}@2x.png
          done
          iconutil -c icns $ICONSET -o "$APP/Contents/Resources/AppIcon.icns"
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>ParadigmShift</string>
            <key>CFBundleDisplayName</key><string>ParadigmShift</string>
            <key>CFBundleIdentifier</key><string>org.paradigmshift.app</string>
            <key>CFBundleExecutable</key><string>ParadigmShift</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          # ad-hoc signature so Apple Silicon Macs accept the universal binary
          codesign --force --deep --sign - "$APP"
          (cd dist && ditto -c -k --keepParent ParadigmShift.app ParadigmShift-macos-universal.zip)
          rm -rf "$APP" $ICONSET

      - name: Smoke test
        if: matrix.name != 'macos'
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = "windows" ]; then target/release/paradigmshift.exe --version; else target/release/paradigmshift --version; fi

      - uses: actions/upload-artifact@v4
        with:
          name: paradigmshift-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: public
      - name: Source (README, screenshots, website, version)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: source
          sparse-checkout: |
            docs/screenshots
            scripts
            site
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Refresh README, screenshots and website
        run: |
          set -e
          VERSION=$(grep -m1 '^version' source/Cargo.toml | cut -d'"' -f2)
          python3 source/scripts/public_readme.py source/README.md > public/README.md
          rm -rf public/docs/screenshots
          mkdir -p public/docs
          cp -r source/docs/screenshots public/docs/
          # the website (GitHub Pages serves docs/): its pages next to the screenshots
          if [ -d source/site ]; then cp -r source/site/. public/docs/; touch public/docs/.nojekyll; fi
          cd public
          git add -A README.md docs
          if git diff --cached --quiet; then
            echo "README and screenshots unchanged"
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Documentation of ParadigmShift $VERSION"
            git push
          fi

      - name: Publish GitHub Release
        working-directory: public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ls -la ../dist
          VERSION=$(grep -m1 '^version' ../source/Cargo.toml | cut -d'"' -f2)
          SOURCE_SHA=$(git -C ../source rev-parse --short HEAD)
          TAG="v$VERSION"
          cat > ../notes.md <<NOTES
          ## ParadigmShift $VERSION – standalone downloads

          No installation needed: download the file for your computer and start it.

          | Computer | File | How to start |
          |---|---|---|
          | Windows 10/11 (64-bit) | **ParadigmShift-windows-x64.exe** | Double-click. If SmartScreen warns about an unknown app: *More info → Run anyway*. |
          | macOS 11+ (Apple Silicon & Intel) | **ParadigmShift-macos-universal.zip** | Unzip, move *ParadigmShift.app* to Applications. The app is not notarised: if macOS refuses to open it, open *System Settings → Privacy & Security* and click *Open Anyway* (on macOS 14 and older: right-click → *Open*). |
          | Linux x86-64 | **ParadigmShift-linux-x86_64.tar.gz** | \`tar xzf ParadigmShift-linux-x86_64.tar.gz && ./ParadigmShift-linux-x86_64/paradigmshift\` |

          Ready-made paradigms: *File → New from template…*. Documentation: see the [README](https://github.com/$GITHUB_REPOSITORY#readme).

          Works with scanner trigger interfaces and response button boxes of any manufacturer – anything that sends key presses (USB keyboard / HID mode) or characters over a serial port; for NordicNeuroLab's SyncBox it can also use NNL's published serial protocol. ParadigmShift is an independent project, not affiliated with, endorsed, sponsored or supported by any hardware manufacturer; product names are used only to describe compatibility.

          Built from source commit $SOURCE_SHA.
          NOTES
          # the same version again (e.g. a documentation change): replace its release
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" ../dist/* --target "$(git rev-parse HEAD)" --title "ParadigmShift $VERSION" \
            --notes-file ../notes.md --latest
          echo "Published $TAG (source $SOURCE_SHA)" >> "$GITHUB_STEP_SUMMARY"
